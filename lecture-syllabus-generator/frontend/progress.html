<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>处理进度 - 课堂PPT大纲生成器</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <header class="header">
        <h1>📚 处理进度</h1>
        <nav><a href="/">返回上传</a> | <a href="/history.html">历史记录</a></nav>
    </header>
    <main class="container">
        <section class="progress-section">
            <h2 id="progress-title">正在读取任务</h2>
            <p id="progress-message" role="status" aria-live="polite">正在检查已保存的处理结果。</p>
            <div class="progress-steps">
                <div class="step" id="step-recognize">
                    <span class="step-icon">1</span>
                    <span class="step-name">内容识别</span>
                    <span class="step-status">等待中</span>
                </div>
                <div class="step" id="step-extract">
                    <span class="step-icon">2</span>
                    <span class="step-name">知识点抽取</span>
                    <span class="step-status">等待中</span>
                </div>
                <div class="step" id="step-cluster">
                    <span class="step-icon">3</span>
                    <span class="step-name">聚类重组</span>
                    <span class="step-status">等待中</span>
                </div>
                <div class="step" id="step-generate">
                    <span class="step-icon">4</span>
                    <span class="step-name">大纲生成</span>
                    <span class="step-status">等待中</span>
                </div>
            </div>
            <div id="page-details" class="page-details"></div>
            <div id="progress-error" class="error hidden" role="alert">
                <p id="progress-error-message"></p>
            </div>
            <div id="low-confidence-warning" class="warning hidden">
                <p>⚠️ 以下页面识别置信度较低，建议重拍：</p>
                <ul id="low-confidence-pages"></ul>
            </div>
            <div id="failed-pages" class="error hidden">
                <p>❌ 以下页面识别失败：</p>
                <ul id="failed-page-list"></ul>
            </div>
            <div class="actions">
                <button id="retry-btn" class="btn btn-warning hidden">重试失败页</button>
                <button id="continue-btn" class="btn btn-secondary hidden">重新检查并继续</button>
                <a id="view-outline" class="btn btn-primary hidden" href="#">查看大纲</a>
            </div>
        </section>
    </main>
    <script src="/js/api.js"></script>
    <script src="/js/progress.js"></script>
</body>
</html>
