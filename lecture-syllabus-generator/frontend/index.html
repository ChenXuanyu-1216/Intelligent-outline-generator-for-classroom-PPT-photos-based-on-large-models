<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课堂PPT照片智能大纲生成器</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <header class="header">
        <h1>📚 课堂PPT照片智能大纲生成器</h1>
        <nav><a href="/">上传</a> | <a href="/history.html">历史记录</a></nav>
    </header>
    <main class="container">
        <section class="upload-section">
            <h2>上传PPT照片</h2>
            <div id="drop-zone" class="drop-zone">
                <p>拖拽图片到此处或点击选择文件</p>
                <p class="hint">支持 JPG / JPEG / PNG / PDF，单张≤10MB，单批≤20张</p>
                <input type="file" id="file-input" multiple accept=".jpg,.jpeg,.png,.pdf" hidden>
            </div>
            <div id="file-list" class="file-list"></div>
            <div class="actions">
                <button id="generate-btn" class="btn btn-primary" disabled>生成大纲</button>
            </div>
            <div class="disclaimer">
                <p>⚠️ AI免责提示：本工具使用AI模型识别PPT内容，生成结果仅供参考，请人工校对后使用。</p>
            </div>
        </section>
    </main>
    <script src="/js/api.js"></script>
    <script src="/js/upload.js"></script>
</body>
</html>
